# Synced with the deployed app config (fly config display on 2026-08-25)
app = "gorilla-cast-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # 'off' = machine never stops; avoids stopped-machine rootfs billing and
  # keeps in-memory rooms alive. Legacy Hobby allowance covers this VM ($0).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
